<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180"
     role="img" aria-label="claude-quota-monitor">
  <title>claude-quota-monitor</title>

  <!-- Tema uyumu: arka plan boyanmiyor. GitHub'in acik ve koyu temasinda
       da, README'de de zemin ne ise onun uzerinde duruyor. Metin
       currentColor kullanmadigi icin iki temada da okunur tonlar secildi. -->

  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#c96442"/>
      <stop offset="1"   stop-color="#e08a5f"/>
    </linearGradient>
  </defs>

  <!-- Isaret: kota halkasi + icinde uc pencere cubugu -->
  <g transform="translate(46 30)">
    <!-- iz -->
    <circle cx="60" cy="60" r="46" fill="none" stroke="#8b94a3" stroke-opacity=".28"
            stroke-width="11"/>
    <!-- dolu yay: ~%72, halkanin kendisi de bir kota gostergesi -->
    <circle cx="60" cy="60" r="46" fill="none" stroke="url(#arc)" stroke-width="11"
            stroke-linecap="round"
            stroke-dasharray="208 289" transform="rotate(-90 60 60)"/>

    <!-- ic cubuklar: uc pencere (5 saatlik / haftalik / kapsamli) -->
    <g fill="#c96442">
      <rect x="42" y="66" width="8" height="16" rx="4"/>
      <rect x="56" y="54" width="8" height="28" rx="4"/>
      <rect x="70" y="44" width="8" height="38" rx="4" fill="#e08a5f"/>
    </g>
  </g>

  <!-- Kelime isareti: tek text, parcalar tspan ile renklendirildi -->
  <text x="176" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="34" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#8b94a3">claude-</tspan><tspan fill="#c96442">quota</tspan><tspan fill="#8b94a3">-monitor</tspan>
  </text>
  <text x="178" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="15" fill="#8b94a3">Resmî kota verisi · sıfır bağımlılık · yalnızca yerel</text>
</svg>
